version: "1"
# Model registry. Capability tiers map to real models below.
# `cheap` is documented as an alias of `mid` (Haiku) with a smaller context
# budget; it is not a separate model entry.
#
# Each entry declares an `accessMode`. Resolution priority at invocation:
#   1. `KIWI_FORCE_ACCESS_MODE` env override
#   2. claude-code-cli (uses local `claude` authentication)
#   3. codex-cli / cursor-agent-cli (uses local CLI auth)
#   4. cursor / jetbrains as IDE surfaces, plus local
#   5. stub (tests only)
models:
  # Claude Code CLI — preferred default, reuses local claude auth.
  # `id` is Kiwi-local. Omit `providerModel` by default so the Claude CLI
  # resolves its current configured/default model dynamically.
  - id: claude-code-cli-frontier
    provider: anthropic
    capability: frontier
    roles: [planner, reviewer, security]
    accessMode: claude-code-cli
    enabled: true
  - id: claude-code-cli-strong
    provider: anthropic
    capability: strong
    roles: [executor, reviewer, security]
    accessMode: claude-code-cli
    enabled: true
  - id: claude-code-cli-mid
    provider: anthropic
    capability: mid
    roles: [researcher, executor, rules]
    accessMode: claude-code-cli
    enabled: true

  # Cursor Agent CLI — uses local cursor-agent login, no direct provider API key
  - id: cursor-agent-auto
    provider: local
    capability: strong
    roles: [planner, researcher, executor, reviewer]
    accessMode: cursor-agent-cli
    enabled: true
  - id: cursor-agent-mid
    provider: local
    capability: mid
    roles: [researcher, executor, reviewer]
    accessMode: cursor-agent-cli
    enabled: true

  # Codex CLI — uses local codex auth, no direct OpenAI API key
  - id: codex-cli-auto
    provider: local
    capability: strong
    roles: [planner, researcher, executor, reviewer, security, rules]
    accessMode: codex-cli
    enabled: true
  - id: codex-cli-mid
    provider: local
    capability: mid
    roles: [researcher, executor, reviewer, rules]
    accessMode: codex-cli
    enabled: true

  # Stub providers — tests/dev fixtures only. CLI/MCP planning and execution
  # ignore these unless explicitly enabled with --allow-stub, KIWI_ALLOW_STUB=1,
  # or KIWI_FORCE_ACCESS_MODE=stub.
  - id: stub-cheap
    provider: stub
    capability: cheap
    roles: [executor, rules]
    accessMode: stub
    enabled: true
  - id: stub-mid
    provider: stub
    capability: mid
    roles: [researcher, executor, rules]
    accessMode: stub
    enabled: true
  - id: stub-strong
    provider: stub
    capability: strong
    roles: [executor, reviewer, security]
    accessMode: stub
    enabled: true
  - id: stub-frontier
    provider: stub
    capability: frontier
    roles: [planner, reviewer, security]
    accessMode: stub
    enabled: true
