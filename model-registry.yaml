version: "1"
# Model registry. Capability tiers map to real models below.
# `cheap` is documented as an alias of `mid` (Haiku) with a smaller context
# budget; it is not a separate model entry.
#
# Each entry declares an `accessMode`. The runtime resolves the best
# available access mode at invocation time, in this default order:
#   1. `KIWI_FORCE_ACCESS_MODE` env (if set)
#   2. claude-code-cli (if `claude` is on PATH)
#   3. codex-cli / cursor-agent-cli (uses local CLI auth)
#   4. cursor / jetbrains as IDE surfaces, plus local
#   5. stub (only for tests/dev fixtures)
#
# Direct API entries are intentionally not part of the daily-use default.
# Claude Code, Codex, and Cursor Agent reuse existing local CLI authentication.
models:
  # Claude Code CLI access (preferred default — uses local `claude` auth)
  - id: claude-code-cli-opus-4-6
    provider: anthropic
    capability: frontier
    roles: [planner, reviewer, security]
    accessMode: claude-code-cli
    enabled: true
  - id: claude-code-cli-sonnet-4-6
    provider: anthropic
    capability: strong
    roles: [executor, reviewer, security]
    accessMode: claude-code-cli
    enabled: true
  - id: claude-code-cli-haiku-4-5
    provider: anthropic
    capability: mid
    roles: [researcher, executor, rules]
    accessMode: claude-code-cli
    enabled: true

  # Cursor Agent CLI access (uses local cursor-agent login; no direct provider API key)
  - id: cursor-agent-auto
    provider: local
    capability: strong
    roles: [executor]
    accessMode: cursor-agent-cli
    enabled: true

  # Codex CLI access (uses local codex auth; no direct OpenAI API key)
  - id: codex-cli-auto
    provider: local
    capability: strong
    roles: [executor]
    accessMode: codex-cli
    enabled: true

  # Stub providers (tests/dev fixtures only — never used for real evidence)
  - id: stub-cheap
    provider: stub
    capability: cheap
    roles: [executor, rules]
    accessMode: stub
    enabled: true
  - id: stub-mid
    provider: stub
    capability: mid
    roles: [researcher, executor, rules]
    accessMode: stub
    enabled: true
  - id: stub-strong
    provider: stub
    capability: strong
    roles: [executor, reviewer, security]
    accessMode: stub
    enabled: true
  - id: stub-frontier
    provider: stub
    capability: frontier
    roles: [planner, reviewer, security]
    accessMode: stub
    enabled: true
