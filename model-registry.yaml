version: "1"
# Model registry. Capability tiers map to real models below.
# `cheap` is documented as an alias of `mid` (Haiku) with a smaller context
# budget; it is not a separate model entry.
#
# Each entry declares an `accessMode`. The runtime resolves the best
# available access mode at invocation time, in this default order:
#   1. `KIWI_FORCE_ACCESS_MODE` env (if set)
#   2. claude-code-cli (if `claude` is on PATH)
#   3. anthropic-api / openai-api (if matching API key is set)
#   4. codex-cli, cursor-agent-cli, cursor, jetbrains, local (when explicitly enabled)
#   5. stub (only for tests/dev fixtures)
#
# Direct API entries are disabled by default — they only matter when the
# operator explicitly opts in by setting their key. Claude Code CLI entries
# are enabled by default because they reuse the operator's existing local
# Claude Code authentication.
models:
  # Claude Code CLI access (preferred default — uses local `claude` auth)
  - id: claude-code-cli-opus-4-6
    provider: anthropic
    capability: frontier
    roles: [planner, reviewer, security]
    accessMode: claude-code-cli
    enabled: true
  - id: claude-code-cli-sonnet-4-6
    provider: anthropic
    capability: strong
    roles: [executor, reviewer, security]
    accessMode: claude-code-cli
    enabled: true
  - id: claude-code-cli-haiku-4-5
    provider: anthropic
    capability: mid
    roles: [researcher, executor, rules]
    accessMode: claude-code-cli
    enabled: true

  # Cursor Agent CLI access (uses local cursor-agent login; no direct provider API key)
  - id: cursor-agent-auto
    provider: local
    capability: strong
    roles: [executor]
    accessMode: cursor-agent-cli
    enabled: true

  # Direct Anthropic API access (opt-in, requires ANTHROPIC_API_KEY)
  - id: claude-opus-4-6
    provider: anthropic
    capability: frontier
    roles: [planner, reviewer, security]
    accessMode: anthropic-api
    enabled: false
  - id: claude-sonnet-4-6
    provider: anthropic
    capability: strong
    roles: [executor, reviewer, security]
    accessMode: anthropic-api
    enabled: false
  - id: claude-haiku-4-5-20251001
    provider: anthropic
    capability: mid
    roles: [researcher, executor, rules]
    accessMode: anthropic-api
    enabled: false

  # Stub providers (tests/dev fixtures only — never used for real evidence)
  - id: stub-cheap
    provider: stub
    capability: cheap
    roles: [executor, rules]
    accessMode: stub
    enabled: true
  - id: stub-mid
    provider: stub
    capability: mid
    roles: [researcher, executor, rules]
    accessMode: stub
    enabled: true
  - id: stub-strong
    provider: stub
    capability: strong
    roles: [executor, reviewer, security]
    accessMode: stub
    enabled: true
  - id: stub-frontier
    provider: stub
    capability: frontier
    roles: [planner, reviewer, security]
    accessMode: stub
    enabled: true
